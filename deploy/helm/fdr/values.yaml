# Default values for fdr.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/anouarmohamed/fdr-k8s
  tag: v1.4.0
  pullPolicy: IfNotPresent

http:
  enabled: true
  address: 0.0.0.0
  port: 9119

terminationGracePeriodSeconds: 30

securityContext:
  privileged: true
  runAsUser: 0
  readOnlyRootFilesystem: true

preflight:
  enabled: true

# Run on every Linux node by default. Example worker-only selector:
# nodeSelector:
#   kubernetes.io/os: linux
#   node-role.kubernetes.io/worker: ""
nodeSelector:
  kubernetes.io/os: linux

# Add tolerations explicitly for tainted worker pools. Control-plane nodes are
# intentionally excluded by default.
tolerations: []

affinity: {}

priorityClassName: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

tracefs:
  hostPath: /sys/kernel/tracing

modules:
  enabled: false
  hostPath: /lib/modules

logs:
  hostPath: /var/log/fdr

config:
  node.conf: |
    instance node
    enable sched/sched_switch
    enable sched/sched_wakeup
    minfree 5
    saveto /var/log/fdr/node.log 64m

extraArgs: []

podAnnotations: {}
podLabels: {}

updateStrategy: {}

monitoring:
  podMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s
    additionalLabels: {}

networkPolicy:
  enabled: false
  ingress:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    podSelector: {}
