# Default values for fdr.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/anouarmohamed/fdr-k8s
  tag: latest
  pullPolicy: IfNotPresent

http:
  enabled: true
  address: 0.0.0.0
  port: 9119

terminationGracePeriodSeconds: 30

securityContext:
  privileged: true
  runAsUser: 0
  readOnlyRootFilesystem: true

# Run on every Linux node by default. Example worker-only selector:
# nodeSelector:
#   kubernetes.io/os: linux
#   node-role.kubernetes.io/worker: ""
nodeSelector: {}

# Tolerate all taints so control-plane and specialized nodes can be traced.
tolerations:
  - operator: Exists

affinity: {}

priorityClassName: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

tracefs:
  hostPath: /sys/kernel/tracing

modules:
  hostPath: /lib/modules

logs:
  hostPath: /var/log/fdr

config:
  node.conf: |
    instance node
    enable sched/sched_switch
    enable sched/sched_wakeup
    minfree 5
    saveto /var/log/fdr/node.log 64m

extraArgs: []

podAnnotations: {}
podLabels: {}

updateStrategy: {}
