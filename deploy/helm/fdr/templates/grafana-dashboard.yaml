{{- if .Values.monitoring.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "fdr.fullname" . }}-grafana-dashboard
  namespace: {{ default .Release.Namespace .Values.monitoring.grafanaDashboard.namespace }}
  labels:
    {{- include "fdr.labels" . | nindent 4 }}
    {{- with .Values.monitoring.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  fdr-overview.json: |
{{ .Files.Get "dashboards/fdr-overview.json" | indent 4 }}
{{- end }}
