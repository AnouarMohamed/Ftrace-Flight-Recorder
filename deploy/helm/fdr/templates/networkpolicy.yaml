{{- if and .Values.http.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fdr.fullname" . }}-http
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fdr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "fdr.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingress.namespaceSelector | nindent 12 }}
          {{- with .Values.networkPolicy.ingress.podSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      ports:
        - port: {{ .Values.http.port }}
          protocol: TCP
{{- end }}
