apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "fdr.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "fdr.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "fdr.selectorLabels" . | nindent 6 }}
  {{- with .Values.updateStrategy }}
  updateStrategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "fdr.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: fdrd
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - -f
            {{- if .Values.http.enabled }}
            - -a
            - {{ .Values.http.address | quote }}
            - -p
            - {{ .Values.http.port | quote }}
            {{- else }}
            - -p
            - "0"
            {{- end }}
            - -d
            - /sys/kernel/tracing
            - -c
            - /etc/fdr.d
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.http.enabled }}
          ports:
            - name: http
              containerPort: {{ .Values.http.port }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tracefs
              mountPath: /sys/kernel/tracing
            - name: modules
              mountPath: /lib/modules
              readOnly: true
            - name: config
              mountPath: /etc/fdr.d
            - name: logs
              mountPath: /var/log/fdr
            - name: logrotate-state
              mountPath: /var/lib/logrotate
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tracefs
          hostPath:
            path: {{ .Values.tracefs.hostPath }}
            type: Directory
        - name: modules
          hostPath:
            path: {{ .Values.modules.hostPath }}
            type: Directory
        - name: config
          configMap:
            name: {{ include "fdr.fullname" . }}-config
            defaultMode: 0440
        - name: logs
          hostPath:
            path: {{ .Values.logs.hostPath }}
            type: DirectoryOrCreate
        - name: logrotate-state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
