apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fdr
  namespace: fdr-system
  labels:
    app: fdr
spec:
  selector:
    matchLabels:
      app: fdr
  template:
    metadata:
      labels:
        app: fdr
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      # Select narrower node pools in an overlay when required.
      # nodeSelector:
      #   kubernetes.io/os: linux
      #   node-role.kubernetes.io/worker: ""
      nodeSelector:
        kubernetes.io/os: linux
      initContainers:
        - name: tracefs-preflight
          image: fdr:v1.4.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              fs_type="$(awk -v path=/sys/kernel/tracing '
                $5 == path {
                  for (i = 1; i <= NF; i++) {
                    if ($i == "-") { print $(i + 1); exit }
                  }
                }
              ' /proc/self/mountinfo)"
              if [ "$fs_type" != "tracefs" ]; then
                echo "fatal: /sys/kernel/tracing is $fs_type, not tracefs" >&2
                exit 1
              fi
              if [ ! -d /sys/kernel/tracing/instances ]; then
                echo "fatal: tracefs instances directory is missing" >&2
                exit 1
              fi
              if [ ! -w /sys/kernel/tracing/instances ]; then
                echo "fatal: tracefs instances directory is not writable" >&2
                exit 1
              fi
          securityContext:
            privileged: true
            runAsUser: 0
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: tracefs
              mountPath: /sys/kernel/tracing
      containers:
        - name: fdrd
          image: fdr:v1.4.0
          imagePullPolicy: IfNotPresent
          args:
            - -f
            - -a
            - 0.0.0.0
            - -p
            - "9119"
            - -d
            - /sys/kernel/tracing
            - -c
            - /etc/fdr.d
          securityContext:
            privileged: true
            runAsUser: 0
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 9119
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tracefs
              mountPath: /sys/kernel/tracing
            - name: config
              mountPath: /etc/fdr.d
            - name: logs
              mountPath: /var/log/fdr
            - name: logrotate-state
              mountPath: /var/lib/logrotate
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
            type: Directory
        - name: config
          configMap:
            name: fdr-config
            defaultMode: 0440
        - name: logs
          hostPath:
            path: /var/log/fdr
            type: DirectoryOrCreate
        - name: logrotate-state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
