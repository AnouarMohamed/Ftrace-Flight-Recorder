apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fdr-system
resources:
  - namespace.yaml
  - daemonset.yaml

configMapGenerator:
  - name: fdr-config
    files:
      - node.conf=fdr.conf

images:
  - name: fdr
    newName: ghcr.io/anouarmohamed/fdr-k8s
    newTag: v1.4.0
