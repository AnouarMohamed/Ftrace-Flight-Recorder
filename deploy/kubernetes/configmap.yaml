apiVersion: v1
kind: ConfigMap
metadata:
  name: fdr-config
  namespace: fdr-system
data:
  node.conf: |
    # Per-node kernel trace capture. Probes must exist on your kernel build.
    instance node
    enable sched/sched_switch
    enable sched/sched_wakeup
    saveto /var/log/fdr/node.log 64m
    minfree 5
