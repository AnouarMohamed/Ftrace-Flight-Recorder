# Pinned lab profile for kube-prometheus-stack 88.5.4.
# It keeps only the components needed to scrape FDR, evaluate its rules, and
# render its Grafana dashboard.
defaultRules:
  create: false

alertmanager:
  enabled: false

grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: 11.5.2
  adminUser: admin
  adminPassword: fdr-lab
  defaultDashboardsEnabled: false
  grafana.ini:
    auth.anonymous:
      enabled: true
      org_role: Viewer
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      isDefaultDatasource: true
      uid: prometheus
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
kubeStateMetrics:
  enabled: false
nodeExporter:
  enabled: false

prometheusOperator:
  # The lab does not expose the operator or enable its admission webhook, so
  # avoid mounting the webhook certificate secret that the focused profile
  # intentionally does not create.
  tls:
    enabled: false
  admissionWebhooks:
    enabled: false

prometheus:
  enabled: true
  prometheusSpec:
    image:
      registry: docker.io
      repository: prom/prometheus
      tag: v3.5.0
    evaluationInterval: 15s
    scrapeInterval: 15s
    retention: 2h
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
