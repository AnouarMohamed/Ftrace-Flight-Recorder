fullnameOverride: fdr-lab

image:
  repository: fdr-lab
  tag: dev
  pullPolicy: Never

config:
  # Remove the chart's example instance; the lab owns one focused recorder.
  node.conf: null
  lab.conf: |
    instance fdr-lab 4m
    enable sched/sched_wakeup
    minfree 5
    # Keep the lab threshold deliberately small so the smoke workflow can
    # exercise fallback rotation without generating a high-volume workload.
    saveto /var/log/fdr/lab.log 16m

monitoring:
  podMonitor:
    enabled: true
    namespace: monitoring
    interval: 15s
    scrapeTimeout: 5s
    additionalLabels:
      release: monitoring
  prometheusRule:
    enabled: true
    namespace: monitoring
    additionalLabels:
      release: monitoring
  grafanaDashboard:
    enabled: true
    namespace: monitoring
    labels:
      grafana_dashboard: "1"

networkPolicy:
  enabled: true
  ingress:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
    podSelector: {}
