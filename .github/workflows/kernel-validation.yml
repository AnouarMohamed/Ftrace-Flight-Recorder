name: Kernel validation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/kernel-validation.yml'
      - 'Makefile'
      - 'deploy/**'
      - 'src/**'
      - 'tests/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/kernel-validation.yml'
      - 'Makefile'
      - 'deploy/**'
      - 'src/**'
      - 'tests/**'
  schedule:
    - cron: "17 03 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kernel-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  host-kernel-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure tracefs is mounted
        run: |
          if ! findmnt -T /sys/kernel/tracing >/dev/null; then
            sudo mkdir -p /sys/kernel/tracing
            sudo mount -t tracefs tracefs /sys/kernel/tracing
          fi
          sudo test -d /sys/kernel/tracing/instances

      - name: Build and run unit tests
        run: |
          make clean check
          make .build/sched_load

      - name: Run real-kernel smoke test
        env:
          FDR_KERNEL_SMOKE_TRACE_ROOT: /sys/kernel/tracing
          FDR_KERNEL_SMOKE_ARTIFACTS: ${{ github.workspace }}/.build/kernel-smoke
        run: |
          sudo --preserve-env=PATH,FDR_KERNEL_SMOKE_TRACE_ROOT,FDR_KERNEL_SMOKE_ARTIFACTS \
            tests/kernel-smoke.sh

      - name: Upload kernel smoke artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-smoke-artifacts
          path: .build/kernel-smoke
          if-no-files-found: ignore
          retention-days: 7

  kubernetes-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4

      - name: Ensure tracefs is mounted
        run: |
          if ! findmnt -T /sys/kernel/tracing >/dev/null; then
            sudo mkdir -p /sys/kernel/tracing
            sudo mount -t tracefs tracefs /sys/kernel/tracing
          fi
          sudo test -d /sys/kernel/tracing/instances

      - name: Create Kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          version: v0.31.0
          cluster_name: fdr-ci
          config: deploy/kind/kind-config.yaml
          wait: 180s
          ignore_failed_clean: true

      - name: Build scheduler load generator
        run: make .build/sched_load

      - name: Run Kubernetes smoke test
        env:
          FDR_K8S_SMOKE_CLUSTER: fdr-ci
          FDR_K8S_SMOKE_REUSE_CLUSTER: "yes"
          FDR_K8S_SMOKE_ARTIFACTS: ${{ github.workspace }}/.build/kubernetes-smoke
        run: tests/kubernetes-smoke.sh

      - name: Upload Kubernetes smoke artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubernetes-smoke-artifacts
          path: .build/kubernetes-smoke
          if-no-files-found: ignore
          retention-days: 7
