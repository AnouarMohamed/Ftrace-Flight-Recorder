name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and test
        env:
          CC: ${{ matrix.compiler }}
          CFLAGS: -O2 -g -Werror
        run: make clean check

      - name: Sanitizers
        if: matrix.compiler == 'clang'
        run: make sanitize SANITIZER_CC=clang

  deployment-manifests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.37.0

      - name: Validate Helm chart
        run: |
          helm lint --strict deploy/helm/fdr
          helm template fdr deploy/helm/fdr --namespace fdr-system \
            > /tmp/fdr-helm-default.yaml
          if grep -q ':latest' /tmp/fdr-helm-default.yaml; then
            echo 'default Helm output contains a mutable latest image' >&2
            exit 1
          fi
          if grep -q '/lib/modules' /tmp/fdr-helm-default.yaml; then
            echo 'default Helm output exposes host modules' >&2
            exit 1
          fi
          helm template fdr deploy/helm/fdr --namespace fdr-system \
            --set modules.enabled=true \
            --set monitoring.podMonitor.enabled=true \
            --set monitoring.prometheusRule.enabled=true \
            --set monitoring.grafanaDashboard.enabled=true \
            --set networkPolicy.enabled=true \
            > /tmp/fdr-helm-optional.yaml
          grep -q 'kind: PodMonitor' /tmp/fdr-helm-optional.yaml
          grep -q 'kind: PrometheusRule' /tmp/fdr-helm-optional.yaml
          grep -q 'fdr-overview.json:' /tmp/fdr-helm-optional.yaml
          grep -q 'kind: NetworkPolicy' /tmp/fdr-helm-optional.yaml
          grep -q 'mountPath: /lib/modules' /tmp/fdr-helm-optional.yaml
          jq empty deploy/helm/fdr/dashboards/fdr-overview.json

      - name: Validate Kind lab assets
        run: |
          sh -n deploy/kind/lab.sh
          helm template fdr-lab deploy/helm/fdr --namespace fdr-lab \
            --values deploy/kind/fdr-values.yaml \
            > /tmp/fdr-kind-lab.yaml
          grep -q 'kind: PodMonitor' /tmp/fdr-kind-lab.yaml
          grep -q 'kind: PrometheusRule' /tmp/fdr-kind-lab.yaml
          grep -q 'uid.*fdr-kernel-recorder' /tmp/fdr-kind-lab.yaml

      - name: Validate Kustomize manifests
        run: |
          kubectl kustomize deploy/kubernetes > /tmp/fdr-kustomize.yaml
          if grep -q ':latest' /tmp/fdr-kustomize.yaml; then
            echo 'Kustomize output contains a mutable latest image' >&2
            exit 1
          fi
          if grep -q '/lib/modules' /tmp/fdr-kustomize.yaml; then
            echo 'base Kustomize output exposes host modules' >&2
            exit 1
          fi
          grep -q 'name: tracefs-preflight' /tmp/fdr-kustomize.yaml
          grep -q 'kubernetes.io/os: linux' /tmp/fdr-kustomize.yaml
